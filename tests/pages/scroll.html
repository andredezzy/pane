<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Scroll</title>
		<style>
			body { font: 17px/1.6 -apple-system, sans-serif; margin: 0 auto; max-width: 760px; padding: 24px; }
			img { display: block; width: 100%; height: auto; border-radius: 8px; }
		</style>
	</head>
	<body>
		<h1>A long page</h1>
		<!-- The scroll benchmark's page: 40 sections of text, each with a photo-like
		image of its own (a JPEG made here, so the fixture stays text), the same on
		every load. window.ready settles once every image is decoded. -->
		<script>
			let seed = 7;
			const random = () => {
				seed = (seed + 0x6d2b79f5) | 0;
				let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
				t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
				return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
			};
			const words = "the a window light over sky page river stone glass morning city quiet road field across under long bright cold street water evening".split(" ");
			const sentence = () => Array.from({ length: 8 + Math.floor(random() * 10) }, () => words[Math.floor(random() * words.length)]).join(" ");
			const paragraph = () => Array.from({ length: 5 }, sentence).map((s) => `${s[0].toUpperCase()}${s.slice(1)}.`).join(" ");

			function image() {
				const canvas = document.createElement("canvas");
				canvas.width = 1024;
				canvas.height = 576;
				const context = canvas.getContext("2d");
				const hue = Math.floor(random() * 360);
				const sky = context.createLinearGradient(0, 0, 0, canvas.height);
				sky.addColorStop(0, `hsl(${hue} 60% 70%)`);
				sky.addColorStop(1, `hsl(${(hue + 40) % 360} 50% 30%)`);
				context.fillStyle = sky;
				context.fillRect(0, 0, canvas.width, canvas.height);
				for (let i = 0; i < 60; i++) {
					context.fillStyle = `hsl(${Math.floor(random() * 360)} 70% 50% / 0.35)`;
					context.beginPath();
					context.arc(random() * canvas.width, random() * canvas.height, 10 + random() * 120, 0, Math.PI * 2);
					context.fill();
				}
				const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
				for (let i = 0; i < pixels.data.length; i += 4) {
					const grain = (random() - 0.5) * 24;
					pixels.data[i] += grain;
					pixels.data[i + 1] += grain;
					pixels.data[i + 2] += grain;
				}
				context.putImageData(pixels, 0, 0);
				const element = new Image(canvas.width, canvas.height);
				element.alt = "";
				element.src = canvas.toDataURL("image/jpeg", 0.9);
				return element;
			}

			for (let index = 1; index <= 40; index++) {
				const section = document.createElement("section");
				const heading = document.createElement("h2");
				heading.textContent = `Section ${index}`;
				section.append(heading);
				for (let p = 0; p < 2; p++) {
					const text = document.createElement("p");
					text.textContent = paragraph();
					section.append(text);
				}
				section.append(image());
				document.body.append(section);
			}

			window.ready = Promise.all([...document.images].map((element) => element.decode()));
		</script>
	</body>
</html>
