<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Permissions</title>
	</head>
	<body>
		<h1>Permissions fixture</h1>
		<script>
			window.result = undefined;
			// Notifications: the prompt's answer as Notification.permission.
			async function askNotifications() {
				window.result = undefined;
				window.result = await Notification.requestPermission();
			}
			// Window management: allowed resolves with the screens.
			async function askWindowManagement() {
				window.result = undefined;
				try {
					const details = await window.getScreenDetails();
					window.result = `granted ${details.screens.length}`;
				} catch (error) {
					window.result = `denied ${error.name}`;
				}
			}
			// Idle detection: the prompt's answer as requestPermission's.
			async function askIdle() {
				window.result = undefined;
				window.result = await IdleDetector.requestPermission();
			}
			// Local fonts: allowed resolves with the fonts, else it throws.
			async function askFonts() {
				window.result = undefined;
				try {
					window.result = `granted ${(await window.queryLocalFonts()).length}`;
				} catch (error) {
					window.result = `denied ${error.name}`;
				}
			}
			async function stateOf(name) {
				return (await navigator.permissions.query({ name })).state;
			}
		</script>
	</body>
</html>
