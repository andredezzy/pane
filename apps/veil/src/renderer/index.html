<!doctype html>
<html lang="en" style="background:#0a0a0c">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pane</title>
		<style>
			#splash {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #0a0a0c;
				z-index: 9999;
				transition: opacity 0.4s ease-out;
			}
			#splash.fade-out {
				opacity: 0;
				pointer-events: none;
			}
			#splash svg {
				width: 32px;
				height: 32px;
				animation: pulse 1.8s ease-in-out infinite;
			}
			@keyframes pulse {
				0%, 100% { opacity: 0.3; }
				50% { opacity: 1; }
			}
		</style>
	</head>
	<body>
		<div id="splash">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<rect x="3" y="3" width="18" height="18" rx="4" stroke="#fafafa" stroke-width="1.5"/>
				<line x1="12" y1="3" x2="12" y2="21" stroke="#fafafa" stroke-width="1.5"/>
			</svg>
		</div>
		<div id="root"></div>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
