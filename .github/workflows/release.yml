name: Release

# Publishes Pane-<version>-arm64.dmg, the asset the in-app update check
# reads, when a v* tag is pushed. The app builds on the prebuilt engine its
# engine sources name (native/engine/prebuilt-engines.tsv): an engine change
# publishes its engine-<key> prerelease first (native/engine/UPGRADING.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # macOS 27 with Xcode 27 on Apple Silicon, as in native.yml.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(tr -d '[:space:]' < native/app/VERSION)"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match native/app/VERSION ${version} (expected ${expected}). Bump native/app/VERSION or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches native/app/VERSION ${version}."

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: PaneKit tests
        working-directory: native/app/PaneKit
        run: swift test

      - name: Engine key
        id: engine
        run: echo "key=$(native/engine/scripts/engine-key.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache the prebuilt engine
        uses: actions/cache@v4
        with:
          path: native/app/build/engines
          key: pane-engine-${{ steps.engine.outputs.key }}

      - name: Fetch the prebuilt engine
        run: echo "PANE_ENGINE_OUT=$(native/engine/scripts/fetch-engine.sh)" >> "$GITHUB_ENV"

      # Ad-hoc signed, as every release so far: Developer ID signing and
      # notarization (PANE_SIGN_IDENTITY, PANE_NOTARY_PROFILE) wait for an
      # identity (native/HUMAN-CHECKLIST.md, 6.2).
      - name: Build the dmg
        run: native/engine/scripts/dist.sh

      - name: Keep the dmg
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: native/app/release/Pane-*-arm64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: native/app/release/Pane-*-arm64.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
