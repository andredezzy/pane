name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./apps/veil/package.json').version")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/veil version ${version} (expected ${expected}). Bump apps/veil/package.json or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches apps/veil version ${version}."

      - name: Typecheck
        run: bunx turbo run typecheck

      - name: Test
        working-directory: apps/veil
        run: bun run test

  build:
    name: Build (${{ matrix.name }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            eb_flags: --mac --arm64
            artifact_name: mac-arm64
            electron_cache: ~/Library/Caches/electron
          - name: macOS x64
            os: macos-15-intel
            eb_flags: --mac --x64
            artifact_name: mac-x64
            electron_cache: ~/Library/Caches/electron
          - name: Windows x64
            os: windows-latest
            eb_flags: --win --x64
            artifact_name: windows-x64
            electron_cache: ~/AppData/Local/electron/Cache
          - name: Linux x64
            os: ubuntu-latest
            eb_flags: --linux --x64
            artifact_name: linux-x64
            electron_cache: ~/.cache/electron

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ matrix.electron_cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('apps/veil/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bunx turbo run build --filter=@pane/veil...

      - name: Package app
        working-directory: apps/veil
        run: bunx electron-builder ${{ matrix.eb_flags }} --publish never
        env:
          # No Apple Developer ID on CI: skip keychain discovery so electron-builder
          # ad-hoc signs (a launchable unsigned build) instead of erroring.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/veil/release/*.dmg
            apps/veil/release/*.exe
            apps/veil/release/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
