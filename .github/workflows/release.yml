name: Release

# Publishes Pane-<version>-arm64.dmg, the asset the in-app update check
# reads, when a v* tag on main is pushed. The app builds on the prebuilt
# engine its engine sources name (engine/prebuilt-engines.tsv): an
# engine change publishes its engine-<key> prerelease first
# (engine/UPGRADING.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# id-token and attestations: the dmg's build provenance (SLSA), which
# `gh attestation verify <dmg> --repo andredezzy/pane` checks.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish
    # macOS 27 with Xcode 27 on Apple Silicon, as in app.yml.
    runs-on: xcode-27

    steps:
      # The whole history, to tell whether the tag is on main.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(tr -d '[:space:]' < app/VERSION)"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/VERSION ${version} (expected ${expected}). Bump app/VERSION or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches app/VERSION ${version}."

      # The release is published as the latest at once, and every Pane's
      # update check offers it: a tag on another branch publishes nothing.
      - name: Verify the tag is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Merge the release into main, then tag it there."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is on main."

      - name: PaneKit tests
        working-directory: app/PaneKit
        run: swift test

      - name: XcodeGen and the prebuilt engine
        uses: ./.github/actions/setup-app-build

      # Ad-hoc signed, as every release so far: Developer ID signing and
      # notarization (PANE_SIGN_IDENTITY, PANE_NOTARY_PROFILE) wait for an
      # identity (docs/human-checklist.md, 6.2).
      - name: Build the dmg
        run: engine/scripts/dist.sh

      - name: Keep the dmg
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: app/release/Pane-*-arm64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Attest the dmg's provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/release/Pane-*-arm64.dmg

      # The notes open with the Chromium the release is built on.
      - name: Chromium version
        id: chromium
        run: echo "version=$(tr -d '[:space:]' < engine/CHROMIUM_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          body: "Built on Chromium ${{ steps.chromium.outputs.version }}."
          generate_release_notes: true
          files: |
            app/release/Pane-*-arm64.dmg
            app/release/Pane-*-arm64.dSYM.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
