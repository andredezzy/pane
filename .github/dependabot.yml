# Bumps the SHA-pinned Actions and the scenario runner's packages, each week
# in one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-app-build
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      packages:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not run on TypeScript 7 yet
      # (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The migration scenario writes data with the Electron the retired
      # Electron app shipped (41.4.0, the electron branch), as its users'
      # data was written.
      - dependency-name: electron
