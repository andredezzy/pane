# XcodeGen spec for the Pane app. Generate with `xcodegen generate` (the
# .xcodeproj is gitignored). The app links PaneCore.framework from the engine
# build in PANE_ENGINE_OUT; native/engine/scripts/package.sh assembles the
# shippable bundle.
name: Pane
options:
  bundleIdPrefix: com.pane
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    PANE_ENGINE_OUT: $(HOME)/chromium/src/out/Release
targets:
  Pane:
    type: application
    platform: macOS
    sources:
      - path: Pane
    settings:
      base:
        PRODUCT_NAME: Pane
        PRODUCT_BUNDLE_IDENTIFIER: com.pane.desktop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: BrowserCrApplication
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../engine/pane/public
        OTHER_LDFLAGS: $(PANE_ENGINE_OUT)/PaneCore.framework/Versions/Current/PaneCore
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
