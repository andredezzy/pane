<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Password form</title>
	</head>
	<body>
		<form id="login" method="post" action="/echo">
			<input id="username" name="value" autocomplete="username">
			<input id="password" name="password" type="password" autocomplete="current-password">
			<button id="send">Sign in</button>
		</form>
	</body>
</html>
