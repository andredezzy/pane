<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Hang</title>
	</head>
	<body>
		<h1>Hung renderer fixture</h1>
		<script>
			// Named Hanging first, so the app's state shows the moment.
			function hang() {
				document.title = "Hanging";
				setTimeout(() => {
					for (;;) {}
				}, 50);
			}
			// ?auto: hang on its own, so no debugger needs to attach (Chromium
			// ignores unresponsive pages while one is).
			if (location.search.includes("auto")) {
				setTimeout(hang, 1000);
			}
		</script>
	</body>
</html>
