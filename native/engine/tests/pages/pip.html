<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Picture in picture</title>
	</head>
	<body>
		<canvas id="canvas" width="160" height="90"></canvas>
		<video id="video" muted playsinline width="160" height="90"></video>
		<script>
			// A video fed by an animated canvas, so no media file is needed.
			const canvas = document.getElementById("canvas");
			const context = canvas.getContext("2d");
			let frame = 0;
			setInterval(() => {
				context.fillStyle = `hsl(${frame++ % 360} 70% 50%)`;
				context.fillRect(0, 0, canvas.width, canvas.height);
			}, 40);
			const video = document.getElementById("video");
			video.srcObject = canvas.captureStream(25);
			video.play();
			window.pip = { entered: false, left: false };
			video.addEventListener("enterpictureinpicture", () => { window.pip.entered = true; });
			video.addEventListener("leavepictureinpicture", () => { window.pip.left = true; });
		</script>
	</body>
</html>
